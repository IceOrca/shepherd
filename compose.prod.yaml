services:
  postgresql-db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER_PROD:?required}
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB_PROD:?required}
      POSTGRES_PORT: ${POSTGRES_PORT_PROD:?required}
      KEYCLOAK_DB_PASSWORD: !reset null
      KEYCLOAK_DB_PASSWORD_FILE: /run/secrets/keycloak_db_password
    secrets:
      - source: postgres_password
        target: postgres_password
      - source: keycloak_db_password
        target: keycloak_db_password
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.5}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-128}

  redis-cache:
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: !reset []
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    pids_limit: ${REDIS_PIDS_LIMIT:-64}

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
      target: runner
    image: iceorca/shepherd-srv:0.1.0
    restart: unless-stopped
    command: !reset null
    env_file: !reset []
    ports: !reset []
    volumes: !reset []
    environment:
      APP_ENV: production
      DATABASE_URL: !reset null
      HOST_IP: 0.0.0.0
      HOST_PORT: ${BACKEND_PORT_PROD:?required}
      REDIS_CACHE_URL: !reset null
      REDIS_QUEUE_URL: !reset null
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128,172.16.0.0/12
      RUST_LOG: ${RUST_LOG:-info}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private_key
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public_key
      KEYCLOAK_ISSUER_URL: ${KEYCLOAK_ISSUER_URL_PROD:?required}
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL_PROD:-http://keycloak:8081/realms/shepherd/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_API_AUDIENCE_PROD:-shepherd-api}
      KEYCLOAK_ACCEPT_FORWARDED_ACCESS_TOKEN: "true"
    secrets:
      - source: jwt_private_key
        target: jwt_private_key
      - source: jwt_public_key
        target: jwt_public_key
      - source: server_prod_env
        target: server_prod_env
    expose:
      - ${BACKEND_PORT_PROD:?required}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    stop_grace_period: 30s

  client:
    build:
      context: ./client/web
      dockerfile: Dockerfile.prod
      target: runner
    image: iceorca/shepherd-cli:0.1.0
    restart: unless-stopped
    command: !reset null
    env_file: !reset []
    volumes: !reset []
    ports: !override
      - "127.0.0.1:${FRONTEND_HTTP_PORT:?required}:80"
    mem_limit: ${FRONTEND_MEMORY_LIMIT:-128m}
    cpus: ${FRONTEND_CPU_LIMIT:-0.25}
    pids_limit: ${FRONTEND_PIDS_LIMIT:-64}

  keycloak:
    restart: unless-stopped
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        export KC_DB_PASSWORD="$$(< /run/secrets/keycloak_db_password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(< /run/secrets/keycloak_admin_password)"
        export OAUTH2_PROXY_CLIENT_SECRET="$$(< /run/secrets/oauth2_proxy_client_secret)"
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME_PROD:?required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: !reset null
      KC_DB_PASSWORD: !reset null
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME_PROD:?required}
      KC_HOSTNAME_STRICT: "true"
      KC_PROXY_HEADERS: xforwarded
      OAUTH2_PROXY_CLIENT_SECRET: !reset null
      OAUTH2_PROXY_REDIRECT_URL_PROD: ${OAUTH2_PROXY_REDIRECT_URL_PROD:?required}
      SHEPHERD_WEB_ORIGIN_PROD: ${SHEPHERD_WEB_ORIGIN_PROD:?required}
      KEYCLOAK_DEV_USER_PASSWORD: !reset null
    ports: !reset []
    expose:
      - "8081"
    volumes: !override
      - ./deploy/keycloak/prod:/opt/keycloak/data/import:ro
    secrets:
      - source: keycloak_db_password
        target: keycloak_db_password
      - source: keycloak_admin_password
        target: keycloak_admin_password
      - source: oauth2_proxy_client_secret
        target: oauth2_proxy_client_secret
    mem_limit: ${KEYCLOAK_MEMORY_LIMIT:-2g}
    cpus: ${KEYCLOAK_CPU_LIMIT:-2}
    pids_limit: ${KEYCLOAK_PIDS_LIMIT:-256}
    stop_grace_period: 30s

  oauth2-proxy:
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID_PROD:?required}
      OAUTH2_PROXY_CLIENT_SECRET: !reset null
      OAUTH2_PROXY_CLIENT_SECRET_FILE: /run/secrets/oauth2_proxy_client_secret
      OAUTH2_PROXY_COOKIE_SECRET: !reset null
      OAUTH2_PROXY_COOKIE_SECRET_FILE: /run/secrets/oauth2_proxy_cookie_secret
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${KEYCLOAK_ISSUER_URL_PROD:?required}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH2_PROXY_REDIRECT_URL_PROD:?required}
      OAUTH2_PROXY_ALLOWED_ROLES: ${OAUTH2_PROXY_ALLOWED_ROLES_PROD:?required}
      # Keep proxy sessions isolated from Shepherd's Redis DB 0.
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://redis-cache:6379/1
      OAUTH2_PROXY_UPSTREAMS: http://server:${BACKEND_PORT_PROD:?required}/auth/,http://server:${BACKEND_PORT_PROD:?required}/api/,http://server:${BACKEND_PORT_PROD:?required}/business/,http://client:80/
      OAUTH2_PROXY_COOKIE_NAME: __Host-shepherd_session
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_TRUSTED_IPS: 127.0.0.1/32,::1/128,172.16.0.0/12
    ports: !reset []
    expose:
      - "4180"
    secrets:
      - source: oauth2_proxy_client_secret
        target: oauth2_proxy_client_secret
      - source: oauth2_proxy_cookie_secret
        target: oauth2_proxy_cookie_secret
    mem_limit: ${OAUTH2_PROXY_MEMORY_LIMIT:-128m}
    cpus: ${OAUTH2_PROXY_CPU_LIMIT:-0.25}
    pids_limit: ${OAUTH2_PROXY_PIDS_LIMIT:-64}

volumes: !override
  pg_data:
  redis_data:

secrets:
  postgres_password:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/postgres_pw
  jwt_private_key:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/jwt_private.pem
  jwt_public_key:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/jwt_public.pem
  server_prod_env:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/server.prod.env
  keycloak_db_password:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/keycloak_db_password
  keycloak_admin_password:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/keycloak_admin_password
  oauth2_proxy_client_secret:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/oauth2_proxy_client_secret
  oauth2_proxy_cookie_secret:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/oauth2_proxy_cookie_secret
