services:
  postgres-db:
    restart: unless-stopped
    ports: !reset []
    environment:
      POSTGRES_USER: ${POSTGRES_USER_PROD:?required}
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB_PROD:?required}
      POSTGRES_PORT: ${POSTGRES_PORT_PROD:?required}
    secrets:
      - source: postgres_password
        target: postgres_password
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    cpus: ${POSTGRES_CPU_LIMIT:-1.5}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-128}

  postgres-bootstrap:
    environment:
      POSTGRES_PORT: ${POSTGRES_PORT_PROD:?required}
      POSTGRES_USER: ${POSTGRES_USER_PROD:?required}
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB_PROD:?required}
      AUTH_DB_PASSWORD: !reset null
      AUTH_DB_PASSWORD_FILE: /run/secrets/auth_db_password
    secrets:
      - source: postgres_password
        target: postgres_password
      - source: auth_db_password
        target: auth_db_password
    mem_limit: ${POSTGRES_BOOTSTRAP_MEMORY_LIMIT:-128m}
    cpus: ${POSTGRES_BOOTSTRAP_CPU_LIMIT:-0.25}
    pids_limit: ${POSTGRES_BOOTSTRAP_PIDS_LIMIT:-32}

  redis-cache:
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    ports: !reset []
    volumes:
      - redis_data:/data
    mem_limit: ${REDIS_MEMORY_LIMIT:-256m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    pids_limit: ${REDIS_PIDS_LIMIT:-64}

  server:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
      target: runner
      args:
        SHEPHERD_CARGO_FEATURES: ${SHEPHERD_CARGO_FEATURES:-}
    image: iceorca/shepherd-srv:0.1.0
    restart: unless-stopped
    command: [ "/app/shepherd-srv" ]
    env_file: !reset []
    ports: !reset []
    volumes: !reset []
    environment:
      APP_ENV: production
      DATABASE_URL: !reset null
      HOST_IP: 0.0.0.0
      HOST_PORT: ${BACKEND_PORT_PROD:?required}
      REDIS_CACHE_URL: !reset null
      REDIS_QUEUE_URL: !reset null
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128,172.16.0.0/12
      RUST_LOG: ${RUST_LOG:-info}
      AUTH_ISSUER_URL: ${AUTH_PUBLIC_URL_PROD:?required}
      AUTH_JWKS_URL: http://supabase-auth:9999/.well-known/jwks.json
      AUTH_AUDIENCE: ${AUTH_AUDIENCE_PROD:-authenticated}
      AUTH_JWT_ALGORITHMS: ${AUTH_JWT_ALGORITHMS_PROD:-EdDSA}
      AUTH_ADMIN_JWT_ALGORITHM: ${AUTH_ADMIN_JWT_ALGORITHM_PROD:?required}
      AUTH_ADMIN_JWT_ROLE: ${AUTH_ADMIN_JWT_ROLE_PROD:?required}
      AUTH_ADMIN_JWT_ISSUER: ${AUTH_PUBLIC_URL_PROD:?required}
      AUTH_ADMIN_JWT_AUDIENCE: ${AUTH_AUDIENCE_PROD:?required}
      AUTH_ADMIN_JWT_EXPIRY_SECS: ${AUTH_ADMIN_JWT_EXPIRY_SECS_PROD:?required}
      HTTP_RATE_LIMIT_PUBLIC_REPLENISH_MILLIS: ${HTTP_RATE_LIMIT_PUBLIC_REPLENISH_MILLIS_PROD:-500}
      HTTP_RATE_LIMIT_PUBLIC_BURST: ${HTTP_RATE_LIMIT_PUBLIC_BURST_PROD:-30}
      HTTP_RATE_LIMIT_IDENTITY_REPLENISH_MILLIS: ${HTTP_RATE_LIMIT_IDENTITY_REPLENISH_MILLIS_PROD:-100}
      HTTP_RATE_LIMIT_IDENTITY_BURST: ${HTTP_RATE_LIMIT_IDENTITY_BURST_PROD:-120}
      HTTP_RATE_LIMIT_ADMIN_REPLENISH_MILLIS: ${HTTP_RATE_LIMIT_ADMIN_REPLENISH_MILLIS_PROD:-1000}
      HTTP_RATE_LIMIT_ADMIN_BURST: ${HTTP_RATE_LIMIT_ADMIN_BURST_PROD:-20}
      HTTP_RATE_LIMIT_PROTECTED_REPLENISH_MILLIS: ${HTTP_RATE_LIMIT_PROTECTED_REPLENISH_MILLIS_PROD:-200}
      HTTP_RATE_LIMIT_PROTECTED_BURST: ${HTTP_RATE_LIMIT_PROTECTED_BURST_PROD:-80}
      HTTP_RATE_LIMIT_HIGH_FREQUENCY_REPLENISH_MILLIS: ${HTTP_RATE_LIMIT_HIGH_FREQUENCY_REPLENISH_MILLIS_PROD:-100}
      HTTP_RATE_LIMIT_HIGH_FREQUENCY_BURST: ${HTTP_RATE_LIMIT_HIGH_FREQUENCY_BURST_PROD:-120}
      HTTP_RATE_LIMIT_STRICT_REPLENISH_MILLIS: ${HTTP_RATE_LIMIT_STRICT_REPLENISH_MILLIS_PROD:-2000}
      HTTP_RATE_LIMIT_STRICT_BURST: ${HTTP_RATE_LIMIT_STRICT_BURST_PROD:-10}
    secrets:
      - source: server_prod_env
        target: server_prod_env
    expose:
      - ${BACKEND_PORT_PROD:?required}
    mem_limit: ${BACKEND_MEMORY_LIMIT:-768m}
    cpus: ${BACKEND_CPU_LIMIT:-1.5}
    pids_limit: ${BACKEND_PIDS_LIMIT:-256}
    stop_grace_period: 30s

  client:
    build:
      context: ./client/web
      dockerfile: Dockerfile.prod
      target: builder
      args:
        VITE_SHEPHERD_AUTH_URL: ${AUTH_PUBLIC_URL_PROD:?required}
        VITE_PLANNED_STAFFING_ENABLED: ${VITE_PLANNED_STAFFING_ENABLED:-false}
    image: iceorca/shepherd-cli-builder:0.1.0
    restart: unless-stopped
    command: [ "npm", "run", "preview", "--", "--host", "0.0.0.0", "--port", "${FRONTEND_PROD_PORT:-4173}" ]
    env_file: !reset []
    volumes: !reset []
    ports: !override
      - "127.0.0.1:${FRONTEND_PROD_PORT:-4173}:${FRONTEND_PROD_PORT:-4173}"
    expose:
      - ${FRONTEND_PROD_PORT:-4173}

  supabase-auth:
    restart: unless-stopped
    env_file: !reset []
    environment:
      API_EXTERNAL_URL: ${AUTH_PUBLIC_URL_PROD:?required}
      GOTRUE_SITE_URL: ${SHEPHERD_WEB_ORIGIN_PROD:?required}
      GOTRUE_URI_ALLOW_LIST: ${AUTH_REDIRECT_ALLOW_LIST_PROD:-${SHEPHERD_WEB_ORIGIN_PROD}/**}
      GOTRUE_DB_DATABASE_URL: ${AUTH_DATABASE_URL_PROD:?required}
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://${POSTGRES_DB_PROD:?required}/public/shepherd_custom_access_token_hook
      GOTRUE_JWT_SECRET: ${AUTH_JWT_SECRET_PROD:?required}
      GOTRUE_JWT_KEYS: ${AUTH_JWT_KEYS_PROD:?required}
      GOTRUE_JWT_VALID_METHODS: ${AUTH_JWT_VALID_METHODS_PROD:?required}
      GOTRUE_JWT_ADMIN_ROLES: ${AUTH_ADMIN_JWT_ROLE_PROD:?required}
      GOTRUE_JWT_ISSUER: ${AUTH_PUBLIC_URL_PROD:?required}
      GOTRUE_JWT_AUD: ${AUTH_AUDIENCE_PROD:-authenticated}
      GOTRUE_JWT_EXP: ${AUTH_JWT_EXPIRY_SECS_PROD:-900}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_SMTP_ADMIN_EMAIL: ${AUTH_SMTP_ADMIN_EMAIL_PROD:?required}
      GOTRUE_SMTP_HOST: ${AUTH_SMTP_HOST_PROD:?required}
      GOTRUE_SMTP_PORT: ${AUTH_SMTP_PORT_PROD:?required}
      GOTRUE_SMTP_USER: ${AUTH_SMTP_USER_PROD:?required}
      GOTRUE_SMTP_PASS: ${AUTH_SMTP_PASSWORD_PROD:?required}
      GOTRUE_SMTP_SENDER_NAME: ${AUTH_SMTP_SENDER_NAME_PROD:-Shepherd}
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED_PROD:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID_PROD:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET_PROD:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${AUTH_PUBLIC_URL_PROD:?required}/callback
      GOTRUE_EXTERNAL_FACEBOOK_ENABLED: ${AUTH_FACEBOOK_ENABLED_PROD:-false}
      GOTRUE_EXTERNAL_FACEBOOK_CLIENT_ID: ${AUTH_FACEBOOK_CLIENT_ID_PROD:-}
      GOTRUE_EXTERNAL_FACEBOOK_SECRET: ${AUTH_FACEBOOK_CLIENT_SECRET_PROD:-}
      GOTRUE_EXTERNAL_FACEBOOK_REDIRECT_URI: ${AUTH_PUBLIC_URL_PROD:?required}/callback
    ports: !override
      - "127.0.0.1:${AUTH_EDGE_PORT_PROD:-9999}:9999"
    expose:
      - "9999"
    mem_limit: ${AUTH_MEMORY_LIMIT:-256m}
    cpus: ${AUTH_CPU_LIMIT:-0.5}
    pids_limit: ${AUTH_PIDS_LIMIT:-128}
    stop_grace_period: 15s

  tenant-bootstrap:
    build:
      context: ./server
      dockerfile: Dockerfile.prod
      target: runner
    image: iceorca/shepherd-srv:0.1.0
    working_dir: /app
    env_file: !reset []
    environment:
      APP_ENV: production
      DATABASE_URL: !reset null
      AUTH_ADMIN_URL: !reset null
      AUTH_ISSUER_URL: !reset null
      AUTH_ADMIN_JWT_ALGORITHM: ${AUTH_ADMIN_JWT_ALGORITHM_PROD:?required}
      AUTH_ADMIN_JWT_ROLE: ${AUTH_ADMIN_JWT_ROLE_PROD:?required}
      AUTH_ADMIN_JWT_ISSUER: ${AUTH_PUBLIC_URL_PROD:?required}
      AUTH_ADMIN_JWT_AUDIENCE: ${AUTH_AUDIENCE_PROD:?required}
      AUTH_ADMIN_JWT_EXPIRY_SECS: ${AUTH_ADMIN_JWT_EXPIRY_SECS_PROD:?required}
      TENANT_BOOTSTRAP_ADMIN_ACCOUNT: ${TENANT_BOOTSTRAP_ADMIN_ACCOUNT_PROD:?required}
      TENANT_BOOTSTRAP_ADMIN_EMAIL: ${TENANT_BOOTSTRAP_ADMIN_EMAIL_PROD:?required}
      TENANT_BOOTSTRAP_ADMIN_SECRET: !reset null
      TENANT_BOOTSTRAP_ADMIN_SECRET_FILE: /run/secrets/tenant_bootstrap_admin_secret
      RUST_LOG: ${RUST_LOG:-info}
    volumes: !reset []
    entrypoint: [ "/app/shepherd-tenant-bootstrap" ]
    secrets:
      - source: server_prod_env
        target: server_prod_env
      - source: tenant_bootstrap_admin_secret
        target: tenant_bootstrap_admin_secret
    mem_limit: ${TENANT_BOOTSTRAP_MEMORY_LIMIT:-256m}
    cpus: ${TENANT_BOOTSTRAP_CPU_LIMIT:-0.5}
    pids_limit: ${TENANT_BOOTSTRAP_PIDS_LIMIT:-64}

  # Development Caddy is replaced by the host edge in production.
  caddy:
    profiles: [ "development-edge-disabled" ]
    ports: !reset []
    volumes: !reset []
    depends_on: !reset {}

volumes: !override
  pg_data:
  redis_data:

secrets:
  postgres_password:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/postgres_pw
  server_prod_env:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/server.prod.env
  auth_db_password:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/auth_db_password
  tenant_bootstrap_admin_secret:
    file: ${SVR_SECRETS_DIR:?SVR_SECRETS_DIR_must_be_set}/tenant_bootstrap_admin_secret
