[package]
name = "shepherd-runtime"
version.workspace = true
edition.workspace = true

[features]
default = []
planned-staffing = ["shepherd/planned-staffing"]
hrm-attendance = ["shepherd/hrm-attendance"]

[[bin]]
name = "shepherd-srv"
path = "src/bin/main.rs"

[[bin]]
name = "shepherd-typescript"
path = "src/bin/typescript.rs"

[[bin]]
name = "shepherd-tenant-bootstrap"
path = "src/bin/tenant_bootstrap.rs"

[[bin]]
name = "shepherd-system-admin-init"
path = "src/bin/system_admin_init.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
dotenvy.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "tls-rustls", "macros", "uuid", "json"] }
uuid.workspace = true
infra-kernel = { workspace = true, features = ["debugging"] }
infra-auth = {workspace = true}
infra-postgres.workspace = true
infra-host.workspace = true
infra-worker.workspace = true
supabase-auth.workspace = true
shepherd.workspace = true

[lints]
workspace = true
