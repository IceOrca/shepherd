upstream shepherd_api {
    # If Nginx runs on the host and the Rust API runs on the host or with
    # Docker port publishing, keep this as 127.0.0.1:8000.
    # If both run in Docker Compose, change this to the API service name,
    # for example: server shepherd-api:8000;
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/shepherd;
    index index.html;

    server_tokens off;
    client_max_body_size 20m;

    gzip on;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    location /api/ {
        proxy_pass http://shepherd_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
    }

    location /auth/ {
        proxy_pass http://shepherd_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
    }

    location = /openapi.json {
        proxy_pass http://shepherd_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 25s;
        proxy_read_timeout 25s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
