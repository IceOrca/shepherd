services:
  postgresql-db:
    image: postgres:18-alpine
    container_name: shepherd-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      PG_APP_USER: ${PG_APP_USER}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
      KEYCLOAK_DB_NAME: keycloak
      KEYCLOAK_DB_USER: keycloak
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-shepherd-keycloak-dev-db-password}
      SHEPHERD_POSTGRES_BOOTSTRAP_IN_CONTAINER: "1"
    ports:
      - "${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - pg_data:/var/lib/postgresql
      - ./scripts/bootstrap-postgres.sh:/docker-entrypoint-initdb.d/10-bootstrap-postgres.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis-cache:
    image: redis:8-alpine
    container_name: shepherd-redis
    ports:
      - "${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: builder
    image: iceorca/shepherd-srv:0.1.0_dev
    container_name: shepherd-server
    working_dir: /app/shepherd_server
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    env_file:
      - ./env_file_server
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL}
      REDIS_QUEUE_URL: ${REDIS_QUEUE_URL}
      HOST_IP: 0.0.0.0
      HOST_PORT: ${BACKEND_PORT:-8000}
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128,172.16.0.0/12
      RUST_LOG: ${RUST_LOG:-debug}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH}
      JWT_PUBLIC_KEY_PATH: ${JWT_PUBLIC_KEY_PATH}
    volumes:
      - ./server:/app/shepherd_server
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - server_target:/app/shepherd_server/target
    command: sleep infinity
    depends_on:
      postgresql-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy

  client:
    build:
      context: ./client/web
      dockerfile: Dockerfile
      target: builder
    image: iceorca/shepherd-cli:0.1.0_dev
    container_name: shepherd-client
    working_dir: /app/shepherd_client
    ports:
      - "${FRONTEND_DEV_PORT:-5173}:${FRONTEND_DEV_PORT:-5173}"
    env_file:
      - ./env_file_client
    environment:
      VITE_SHEPHERD_DEV_PROXY_TARGET: http://server:${BACKEND_PORT:-8000}
    volumes:
      - ./client/web:/app/shepherd_client
      - client_node_modules:/app/shepherd_client/node_modules
      - npm_cache:/root/.npm
    command: sleep infinity
    depends_on:
      - server

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: shepherd-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-shepherd-keycloak-dev-admin-password}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-shepherd-keycloak-dev-db-password}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8081"
      KC_HOSTNAME: http://keycloak.localhost:8081
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-shepherd-dev-oauth2-client-secret}
      KEYCLOAK_DEV_USER_PASSWORD: ${KEYCLOAK_DEV_USER_PASSWORD:-shepherd-dev-password}
    ports:
      - "8081:8081"
    volumes:
      - ./deploy/keycloak/dev:/opt/keycloak/data/import:ro
    networks:
      default:
        aliases:
          - keycloak.localhost
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      postgresql-db:
        condition: service_healthy

  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3
    container_name: shepherd-oauth2-proxy
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:-shepherd-web}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:-shepherd-dev-oauth2-client-secret}
      OAUTH2_PROXY_OIDC_ISSUER_URL: http://keycloak.localhost:8081/realms/shepherd
      OAUTH2_PROXY_REDIRECT_URL: http://localhost:4180/oauth2/callback
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SCOPE: openid profile email
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: http://server:${BACKEND_PORT:-8000}/auth/,http://server:${BACKEND_PORT:-8000}/api/,http://server:${BACKEND_PORT:-8000}/business/,http://client:${FRONTEND_DEV_PORT:-5173}/
      OAUTH2_PROXY_SESSION_STORE_TYPE: redis
      OAUTH2_PROXY_REDIS_CONNECTION_URL: redis://redis-cache:6379/1
      OAUTH2_PROXY_COOKIE_NAME: shepherd_oauth2
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-shepherd-dev-cookie-secret-32chx}
      OAUTH2_PROXY_COOKIE_SECURE: "false"
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      OAUTH2_PROXY_COOKIE_EXPIRE: 8h
      OAUTH2_PROXY_COOKIE_REFRESH: 4m
      OAUTH2_PROXY_PASS_ACCESS_TOKEN: "true"
      OAUTH2_PROXY_PASS_AUTHORIZATION_HEADER: "false"
      OAUTH2_PROXY_PASS_BASIC_AUTH: "false"
      OAUTH2_PROXY_PASS_USER_HEADERS: "false"
      OAUTH2_PROXY_REVERSE_PROXY: "false"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    ports:
      - "4180:4180"
    depends_on:
      keycloak:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      server:
        condition: service_started
      client:
        condition: service_started

volumes:
  pg_data:
  cargo_registry:
  cargo_git:
  server_target:
  client_node_modules:
  npm_cache:
