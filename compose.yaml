services:
  postgres-db:
    image: postgres:18-alpine
    container_name: shepherd-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:${POSTGRES_PORT:-5432}"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 20

  postgres-bootstrap:
    image: postgres:18-alpine
    container_name: shepherd-pg-bootstrap
    restart: "no"
    environment:
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PG_APP_USER: ${PG_APP_USER}
      PG_APP_PASSWORD: ${PG_APP_PASSWORD}
      AUTH_DB_USER: ${AUTH_DB_USER}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      SHEPHERD_POSTGRES_BOOTSTRAP_JOB: "1"
    volumes:
      - ./scripts/bootstrap-postgres.sh:/usr/local/bin/bootstrap-postgres.sh:ro
    command: ["sh", "/usr/local/bin/bootstrap-postgres.sh"]
    depends_on:
      postgres-db:
        condition: service_healthy

  redis-cache:
    image: redis:8-alpine
    container_name: shepherd-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:${REDIS_PORT:-6379}"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: builder
    image: iceorca/shepherd-srv:0.1.0_dev
    container_name: shepherd-server
    working_dir: /app/shepherd_server
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    env_file:
      - ./env_file_server
      - ./deploy/supabase/dev/auth-admin.env
    environment:
      APP_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL}
      REDIS_QUEUE_URL: ${REDIS_QUEUE_URL}
      HOST_IP: 0.0.0.0
      HOST_PORT: ${BACKEND_PORT:-8000}
      TRUSTED_PROXY_CIDRS: 127.0.0.1/32,::1/128,172.16.0.0/12
      RUST_LOG: ${RUST_LOG:-debug}
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL}
      AUTH_ACCOUNT_CACHE_TTL_SECS: ${AUTH_ACCOUNT_CACHE_TTL_SECS:-60}
      AUTH_JWKS_URL: http://supabase-auth:9999/.well-known/jwks.json
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-authenticated}
      AUTH_JWT_ALGORITHMS: ${AUTH_JWT_ALGORITHMS:-EdDSA}
      AUTH_ADMIN_URL: http://supabase-auth:9999
      STAFFING_GPS_ENABLED: "false"
      WORKER_SHUTDOWN_TIMEOUT_SECS: ${WORKER_SHUTDOWN_TIMEOUT_SECS:-60}
      NOTIFICATION_CLAIM_BATCH_SIZE: ${NOTIFICATION_CLAIM_BATCH_SIZE:-20}
      NOTIFICATION_DELIVERY_TIMEOUT_SECS: ${NOTIFICATION_DELIVERY_TIMEOUT_SECS:-15}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-8}
      NOTIFICATION_POLL_INTERVAL_SECS: ${NOTIFICATION_POLL_INTERVAL_SECS:-2}
      NOTIFICATION_PROCESSING_LOCK_TIMEOUT_SECS: ${NOTIFICATION_PROCESSING_LOCK_TIMEOUT_SECS:-600}
      NOTIFICATION_PROVIDER_HTTP_TIMEOUT_SECS: ${NOTIFICATION_PROVIDER_HTTP_TIMEOUT_SECS:-10}
      NOTIFICATION_RETRY_BASE_DELAY_SECS: ${NOTIFICATION_RETRY_BASE_DELAY_SECS:-1}
      NOTIFICATION_RETRY_MAX_DELAY_SECS: ${NOTIFICATION_RETRY_MAX_DELAY_SECS:-300}
    volumes:
      - ./server:/app/shepherd_server
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - server_target:/app/shepherd_server/target
    command: sleep infinity
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully
      redis-cache:
        condition: service_healthy
      supabase-auth:
        condition: service_healthy

  client:
    build:
      context: ./client/web
      dockerfile: Dockerfile
      target: builder
    image: iceorca/shepherd-cli:0.1.0_dev
    container_name: shepherd-client
    working_dir: /app/shepherd_client
    ports:
      - "127.0.0.1:${FRONTEND_DEV_PORT:-5173}:${FRONTEND_DEV_PORT:-5173}"
    env_file:
      - ./env_file_client
    environment:
      VITE_SHEPHERD_DEV_PROXY_TARGET: http://server:${BACKEND_PORT:-8000}
      VITE_SHEPHERD_AUTH_DEV_PROXY_TARGET: http://supabase-auth:9999
      VITE_SHEPHERD_AUTH_URL: ${AUTH_PUBLIC_URL}
      VITE_STAFFING_GPS_ENABLED: "false"
    volumes:
      - ./client/web:/app/shepherd_client
      - client_node_modules:/app/shepherd_client/node_modules
      - npm_cache:/root/.npm
    command: sleep infinity
    depends_on:
      - server

  supabase-auth:
    image: supabase/gotrue:v2.196.0
    container_name: shepherd-auth
    restart: unless-stopped
    env_file:
      - ./deploy/supabase/dev/auth.env
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${AUTH_PUBLIC_URL}
      GOTRUE_SITE_URL: ${SHEPHERD_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${SHEPHERD_PUBLIC_URL}/**,http://localhost:${FRONTEND_DEV_PORT:-5173}/**
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${AUTH_DB_USER}:${AUTH_DB_PASSWORD}@postgres-db:${POSTGRES_PORT:-5432}/${POSTGRES_DB}?search_path=auth
      DB_NAMESPACE: auth
      GOTRUE_DB_MAX_POOL_SIZE: 10
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_ENABLED: "true"
      GOTRUE_HOOK_CUSTOM_ACCESS_TOKEN_URI: pg-functions://${POSTGRES_DB}/public/shepherd_custom_access_token_hook
      GOTRUE_JWT_ISSUER: ${AUTH_ISSUER_URL}
      GOTRUE_JWT_AUD: ${AUTH_AUDIENCE:-authenticated}
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_EXP: ${AUTH_JWT_EXPIRY_SECS:-900}
      GOTRUE_DISABLE_SIGNUP: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${AUTH_GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${AUTH_PUBLIC_URL}/callback
      GOTRUE_EXTERNAL_FACEBOOK_ENABLED: ${AUTH_FACEBOOK_ENABLED:-false}
      GOTRUE_EXTERNAL_FACEBOOK_CLIENT_ID: ${AUTH_FACEBOOK_CLIENT_ID:-}
      GOTRUE_EXTERNAL_FACEBOOK_SECRET: ${AUTH_FACEBOOK_CLIENT_SECRET:-}
      GOTRUE_EXTERNAL_FACEBOOK_REDIRECT_URI: ${AUTH_PUBLIC_URL}/callback
    ports:
      - "127.0.0.1:${AUTH_PORT:-9999}:9999"
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres-bootstrap:
        condition: service_completed_successfully

  caddy:
    image: caddy:2.11-alpine
    container_name: shepherd-caddy
    restart: unless-stopped
    environment:
      REMOTE_DEV_DNS_NAME: ${REMOTE_DEV_DNS_NAME}
      AUTH_DEV_DNS_NAME: ${AUTH_DEV_DNS_NAME}
      SHEPHERD_API_DEV_UPSTREAM: server:${BACKEND_PORT:-8000}
      SHEPHERD_WEB_DEV_UPSTREAM: client:${FRONTEND_DEV_PORT:-5173}
      AUTH_DEV_UPSTREAM: supabase-auth:9999
    ports:
      - "${REMOTE_DEV_BIND_IP:-127.0.0.1}:80:80"
      - "${REMOTE_DEV_BIND_IP:-127.0.0.1}:443:443"
      - "${REMOTE_DEV_BIND_IP:-127.0.0.1}:443:443/udp"
    volumes:
      - ./deploy/Caddy/dev/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: [ "CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      supabase-auth:
        condition: service_healthy
      server:
        condition: service_started
      client:
        condition: service_started

volumes:
  pg_data:
  cargo_registry:
  cargo_git:
  server_target:
  client_node_modules:
  npm_cache:
  caddy_data:
  caddy_config:
